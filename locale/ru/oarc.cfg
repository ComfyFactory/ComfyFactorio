ms-max-players-shared-spawn=Если вы создадите собственную точку появления, вы сможете пригласить до __1__ других онлайн-игроков.
ms-spawn-dist-notes=Близкая точка появления находится на расстоянии от __1__ до __2__ чанков от центра карты.\nДальняя точка появления находится на расстоянии от __3__ до __4__ чанков от центра карты.\nПоявление в одиночку опасно! Будьте готовы к сражению, чтобы добраться до других игроков.
