ms-buddy-spawn-instructions=Чтобы воспользоваться этой функцией, убедитесь, что вы и ваш напарник одновременно находитесь в этом меню. Запрос должен отправить только один из вас. Выберите своего напарника из списка (обновите список, если его имя не отображается) и выберите параметры появления. Нажмите одну из кнопок запроса, чтобы отправить его. Затем напарник сможет принять (или отклонить) запрос. Это позволит вам обоим появиться рядом друг с другом, причём у каждого будет своя зона появления. Как только напарник примет запрос на появление, он станет окончательным!
