[mountain_fortress_v3]
map_info_main_caption=Г О Р Н А Я    К Р Е П О С Т Ь    V3
map_info_sub_caption=~~ space age копаю копаю камни камни ~~
map_info_text=Посмотрите [img=utility/custom_tag_icon] для получения информации о том, как можно выиграть игру!\nЗавершение/победа на карте увеличивает сложность (урон/здоровье).\n\nИгра [color=red]рандомизирует[/color], в какую сторону атаковать.\nПосле победы направление развернется. Это изменяется при каждом мягком перезапуске.\n\nЧтобы связать сундук внутри локомотива, поставьте железный или стальной сундук.\nЗатем откройте сундук и нажмите кнопку в правом верхнем углу.\n\nКусаки уловили запах рыбы в грузовом вагоне.\nПроводите поезд в гору и защищайте его как можно дольше!\nЭто, однако, будет нелёгкой задачей,\nпоскольку их сила и численность со временем увеличиваются.\n\nКроме того, южные земли со временем разрушаются.\n\nПродвигайтесь глубже для бо́льших сокровищ, и сталкивайтесь с возрастающими опасностями.\nИсследование продуктивности добычи приведет к улучшению вашего добывающего оборудования, и увеличит размер вашего рюкзака.\n\nКогда вы будете копать, вы встретите непроходимые тёмные пропасти или реки.\nПо вам будет стрелять артиллерия! Копайте быстро, копайте на север!\n\nНемного взрывчатки может вызвать обвал гор, заполняя пустоту, создавая новые пути.\nВсё, что вам нужно, это контейнер и точный выстрел.\n\nВойдите в грузовой вагон, чтобы открыть пространство вагона!\n\nСлучайные здания, генерирующие ресурсы, могут быть найдены в мире.\n\nРазмещение стальных сундуков рядом с грузовыми вагонами позволить быстро перемещать содержимое.\n\nНахождение в ауре поезда предотвращает появление кусак при добыче объектов.\n\nРадары нельзя строить рядом друг с другом.\n\nИнтерфейс RPG отключается внутри поезда.\nОтсоединение вагонов отключено.\nВы не можете отменить крафт, находясь в зоне поезда.\n\nНе пытайтесь идти на север на Паукотроне, если поезд не рядом с вами.\nВы были предупреждены.\nУ буров большой бонус производительности, и его можно увеличить исследованиями, используйте по возможности!\nЗагадочный сундук в локомотиве предлагает некоторые награды.\nЕго нужно накормить, чтобы получить награды.\n\n«Захват флага» (CTF): захватите флаги и верните их к локомотиву до истечения времени, чтобы получить командные награды!\nБудьте готовы к появлению всё более опасных противников, которые будут нападать на вас, пока вы несёте флаг. Во время переноски флага заклинания RPG отключены.\n\nЗаброшенные ретрансляционные станции обеспечивают 1/5/10 МВт непрерывной мощности в зависимости от размера при подключении через опору ЛЭП.\nЗащищайте их от кусак: разрушенные станции утрачены навсегда.\n\nУдачи вам в пути!

