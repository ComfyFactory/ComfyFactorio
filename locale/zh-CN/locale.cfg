[native_war]
map_info= - - 本土战争 - -\n\n     	打败敌人！\n\n为您的市场提供科技包，以产生一波又一波的友方咬人虫和随地吐痰虫！\他们很快就会蜂拥到对方的地盘！\n\n走廊里满是虫子。\购买虫子并升级它们以阻止浪潮！\n\n下一次能量将激活光束。\nBeam将随着更多多余的能量而进步。\n根据光束的位置，会产生新的粒子。\n\n使用雷达侦察对手的基地。\利用你的经验提高咬人的伤害和抵抗力。\n空间科学包为你的虫子提供额外的生命。\n建筑机器人不能在墙上建造。\n

[territorial_control]
map_info_main_caption=T E R R I T O R I A L    C O N T R O L
map_info_sub_caption=    ..alone in the darkness..
map_info_text=公民日志#468-2A-3287，自由职业者特伦特。 \n\n对于正在阅读此消息的人来说，\n任何自然资源都是稀有的，而有价值的资源对我来说太难获得。 \n幸运的是，沉船会产生各种有用的废料，但也存在各种危险。 \n前几天挖废品时差点失去半条腿。 \n野生动物极具攻击性，尤其是在夜间。 \n大多数这些看起来像生物的昆虫似乎生活在地下。 \n如果你想有机会在这里生存，请呆在光源附近！ \n\n###日志结束###

[infestation_islands]
map_info_main_caption=I N F E S T A T I O N  I S L E S
map_info_sub_caption=    ~~ 清除虫群，夺取土地 ~~
map_info_text=你从一个满是虫子的小岛开始。\n你的任务很简单：清除岛上的所有虫子。\n\n安全后，前往市场解锁下一个岛屿。\n每个新岛屿都会更加危险，[color=yellow]解锁更多的技术和食谱[/color]——更多的虫子，更多的巢穴，更多的战斗。\n\n杀死咬人。解锁下一个岛屿。冲洗并重复。\只有消灭虫群，才能取得真正的胜利。\n\n祝你好运，战士。

[minesweeper]
map_info_main_caption=扫 雷
map_info_sub_caption=汉化作者: fang-fang
map_info_text=机械生命体曾经统治过这个世界。\n他们早已离开，留下了一片适合居住的荒地。\n它似乎还布满了埋藏的炸药。\n\n用你的石炉标记地雷。\n标记的地雷可以在上面行走。\n当某个区域标记了足够多的地雷时，\n他们会解除武装并获得奖励！\n错误标记可能会触发周围的地雷！！\n\n当你离开出生点时，\n解除武装所需的地雷密度和半径将会增加。\n箱子将包含更多战利品，矿石将具有更高的产量。\n\n数字的地板和泥土不太相配。\n铺设一些石砖或更好的东西可能会有所帮助。
