[dungeons]
map_info_main_caption=地下城
map_info_sub_caption=    ~你穿上长袍，戴上巫师帽。你还在地牢里。~
map_info_text=到深处寻找宝藏。\n每次发现新房间时，左上角的深度计都会增加。\n\n敌人变得更加坚硬。\n资源产生更多矿石。\n战利品变得更加闪亮。\n\n你可以使用绿色地下带进行远距离运输。\n\n你能走多远？
