softmod_info_body_1=最新消息和聊天: getcomfy.eu/discord

softmod_info_game_description_1=游戏介绍
softmod_info_game_description_2=在这个多人游戏场景中启航。收集资源并为船添加燃料，以便尽可能航行更多的里格（距离单位）。 船使用代码魔法移动。每个团队都有一名船长，他决定船何时出坞等行动。达布隆（金币）可以在整个游戏中不同的市场上花费。\n\n团队人数越少，游戏进程越慢。\n\n[font=default-bold]获胜条件:[/font] 航行1000里格。\n[font=default-bold]失败条件:[/font] 船耗尽燃料或重炮被摧毁。

# softmod_info_bugs_1=已知问题
# softmod_info_bugs_2=•

softmod_info_new_players_1=对于新手的建议
softmod_info_new_players_2=开采煤炭和其他资源并将它们带到船上，或者向船长询问更具体的任务。

softmod_info_tips_1=这个模式单人难以完成
softmod_info_tips_2=• 船长（或官员）可以通过在瞭望台的蓝色箱子中放置50个铁路信号来驾驶船舶向左或向右转。在船头的蓝箱放置信号灯可以微调登陆点\n• 岛上可用的矿石数量与你打碎岩石的顺序无关。\n• 每个岛上的被动污染随着时间的推移而增加。\n• 当船移动时，甲板上的落地物品会被移至船长舱。\n•随着联赛的进行，采矿生产率自然会提高。\在多人游戏中，96小时不活动的船员会自动解散。\n• 命令: /classinfo {classname} 给出指定职业的描述（注意职业名称必须使用英文，例如/classinfo deckhand）。想要管理你的职业，请使用 /take {classname} 成为指定职业或 /giveup 放弃当前职业。虫子尸体太多，请点击右下角的[entity=big-biter]。

softmod_info_1_1=v1.7 highlights
softmod_info_1_2=• Support for Factorio 2.0.\n• With the introduction of remote view, spectator mode has been retired.\n• 9 simultaneous crews are now supported.\n• The treasure map mechanic has been reworked to use cameras.\n• Ship movement no longer causes players to exit the GUI of entities on the ship.\n• Performance improvements.

softmod_info_2_1=v1.6 highlights
softmod_info_2_2=• New runs begin on the top lane so that beginners are more likely to encounter docks.\n• Players now die rather than being temporarily marooned if they miss the boat.\n• The pause at sea now occurs after the loading time for the next destination.\n• Optional setting for new crews to disable blueprints.\n• Machines now deactivate after several minutes spent waiting at sea.\n• Private crews and captain-protected crews no longer revert to public crews when inactive. Runs now autodisband after 96 hours of inactivity.\n• Shotguns are now buffed as intended.

softmod_info_credits_1=工作人员
softmod_info_credits_2=海盗船由 thesixthroc 设计和编码。Piratux 参与开发。Comfy 代码基础和帮助来自 Gerkiz, Hanakocz 和 Mew @ Comfy Industries (https://getcomfy.eu)。一些由 Mattisso 提供的岛屿结构蓝图。\n\n汉化：dwightkung\n\n 欢迎来和我们聊天: https://getcomfy.eu/discord\n\n"那些白手套。我永远不会忘记它们，直到我死去的那一天。" - Dr. John
softmod_info_credits_2_old=Softmod designed and written by thesixthroc. Comfy codebase help from Gerkiz, Hanakocz and Mew @ Comfy Industries (https://getcomfy.eu). Some island structure blueprints were contributed by Mattisso. Gold sprite by Clint Bellanger. Parrot sprites by @pixelthen.\n\n"Those white gloves. I'll never forget them 'till the day I die." - Dr. John
