[modules_towny]
map_info=__1__\n\n__2__\n\n__3__\n\n__4__\n\n__5__
map_info1=要与另一个城镇结盟或定居，请在他们的市场或角色上扔一条 [entity=raw-fish]。（默认热键Z）\n他们必须对您执行同样的操作才能完成请求。\n扔 [entity=coal] 会产生相反的结果，因为他会成为敌人驱逐定居者。
map_info2=要创建一个城镇,单击屏幕顶部建筑与创建按钮进行切换，请在一个有效的位置放置一个 [entity=stone-furnace]。\n只有足够宽敞且远离其他城镇和虫子的开阔地区，才可以创建。城镇中心只能手动修复。\n镇上的建筑只能靠近自己的其他建筑才能建筑(类似红警的延伸建筑机制)。\n另外，虫子对研究更为先进的城镇更具攻击性。\n这一演变将围绕所有城镇的平均研究值计算。\n没有创建城镇中心的人是流浪者😈，因为没有市场资源的交流，所以无法进行科研。
map_info3=一次只能拥有一个城镇中心。只有村长(创建者)才能驱逐成员。\n成员可以邀请其他玩家和团队。成员们可以用一块 [entity=coal] 离开城镇。\n城镇中心周围附近会禁止外乡人建造建筑(比如外乡人无法铺设炮塔)。
map_info4=如果没有人用一条 [entity=raw-fish]结成联盟，所有的城镇都是彼此的对手。\n如果一个城镇中心倒下，整个团队都会跟着倒下，所有建筑都会变成中立阵营。\n城镇中心也是成员的重生点。
map_info5=规则很少。玩得开心，By Comfy ^.^
