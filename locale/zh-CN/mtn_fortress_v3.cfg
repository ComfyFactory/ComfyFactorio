[mountain_fortress_v3]
map_info_main_caption==山地要塞V3
map_info_sub_caption=    ..……呜～呜～，框哧～框哧～框哧……..
map_info_text=\n 汉化有限，大部分靠词典翻译，跟个人理解。。请勿吐槽！！！！\n~~~~~~~~~~~~~~~~汉化作者KK_KK~~~~~~~~~~~~~~~~~\n~~~~~~~~~~~~~~~~汉化补充fang-fang~~~~~~~~~~~~~~~~~\n\n[color=red][img=utility/danger_icon] READ THIS! [img=utility/danger_icon][/color]\n\n查看 [img=utility/custom_tag_icon] 了解有关如何赢得游戏的信息！\n完成/赢得地图会增加难度（伤害/生命值）。\n\n要在机车内连接一个箱子，请放置一个铁或钢箱子。\n然后打开箱子，按下右上角的按钮。\n\n虫子已经闻到了货车里的鱼的气味。虫子大军正在集结。\n引导列车向山里前进，并尽可能长时间地保护它！\n然而，这将不是一项容易的任务\n因为它们的力量和数量会随着时间的推移而增加\n此外，随着时间的推移，南部的地面也会坍塌。\n\n深入寻找更大的宝藏，但也要面临更大的危险。\n采矿产能科技，升级你的采矿速度，增加你的背包大小。\n\n当你挖掘时，你会遇到无法逾越的黑暗深渊或河流。\n炮兵会试图击落你！快挖，向北挖！\n\n有些炸药可能会导致岩石从山上掉下来，填补黑暗深渊，创造新的道路。\n他们所需要的只是一个箱子和一把瞄准好的抢。\n\n进入火车车厢，会进入火车内部空间！\n\n世界各地都可以找到产生资源的随机建筑。\n\n将钢制箱子放在货车附近可以快速转移物品。\n\n在挖掘实体时，处于火车光环内可以防止虫巢产卵。\n\n雷达不能建得很近。\n\nRPG GUI在列车内被禁用。\n\n断开列车车厢被禁用。\n当你站在火车光环中时，你不能取消手工制作。\n\n如果火车不在你附近，不要试图带着你的蜘蛛机甲向北跑。\n您已收到警告。\n\n挖矿会获得金币，每次研究后也会获得金币，尽可能使用它们！\n\n火车头上的神秘箱子提供了一些奖励。\n要想得到这样的奖励，就必须满足箱子需求。\n\n祝你旅途顺利!

