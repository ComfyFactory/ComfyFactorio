[mountain_fortress_v3]
map_info_main_caption==山地要塞V3
map_info_sub_caption=    ~~ 掘地三尺，碎石开路 ~~
map_info_text=\n 汉化有限，大部分靠词典翻译，跟个人理解。。请勿吐槽！！！！\n~~~~~~~~~~~~~~~~汉化作者KK_KK~~~~~~~~~~~~~~~~~\n~~~~~~~~~~~~~~~~汉化补充fang-fang~~~~~~~~~~~~~~~~~\n[color=red][img=utility/danger_icon] 注意阅读 [img=utility/danger_icon]\n如果出现任何代码错误或同步问题，请立即向 @Gerkiz 报告！\n如果存在任何破坏游戏的严重漏洞，本图可能会关闭以进行热修复。[/color]\n\n查看 [img=utility/custom_tag_icon] 了解如何赢得游戏！\n完成/通关本图会增加难度（伤害/生命值）。\n\n游戏会[color=red]随机决定[/color]推进方向。\n胜利后会再次反转方向。每次软重置都会改变此设定。\n\n要在机车内部连接箱子，请放置一个关联箱。\n然后打开箱子并点击右上角的按钮。\n\n虫群已经闻到了货运车厢里鱼的气味。\n引导火车进入山脉，并尽可能久地保护它！\n但这并非易事，\n因为它们的实力和数量会随时间增长。\n\n此外，南方的地面会随时间逐渐塌陷。\n\n深入挖掘可获得更大的宝藏，但也会面临更大的危险。\n采矿产能科技将全面升级你的采矿设备，增加背包容量。\n\n在你挖掘过程中，会遇到无法通行的黑暗深渊或河流。\n火炮会试图将你击落！快挖，向北挖！\n\n某些爆炸物可能导致岩石从山上滚落，填满空隙，开辟新的路径。\n它们只需要一个容器和一发精准的射击。\n\n进入货运车厢即可揭示车厢表面！\n\n世界各地都可以找到能生成资源的随机建筑。\n\n在货运车厢旁放置钢箱，可以让你快速转移内容物。\n\n停留在列车光环范围内，可以在挖掘实体时阻止虫群生成。\n\n雷达不能建在彼此附近。\n\n列车内禁用 RPG 界面。\n\n禁用断开连接车厢的功能。\n站在列车光环范围内时，无法取消制作。\n\n如果列车不在附近，不要试图用你的蜘蛛机甲向北跑。\n你已经得到了警告。\n\n采矿钻机拥有巨大的采矿加成，每次研究后还会进一步提升，尽可能使用它们！\n\n机车内的神秘箱子会提供一些奖励。\n你必须向箱子中喂入物品才能获得这些奖励。\n\n祝你的旅途好运！

