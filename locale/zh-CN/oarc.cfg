ms-buddy-spawn-instructions=使用此功能时，请确保你和你的搭档同时处于此菜单中。只需其中一人发送请求。从列表中选择你的搭档（如果看不到搭档的名字请刷新），然后选择你的出生选项。点击其中一个请求按钮发送请求。另一名搭档随后可以接受（或拒绝）该请求。这将使你们两人彼此相邻出生，各自拥有自己的出生区域。一旦搭档接受了出生请求，便不可更改！

