ship-desc-Atlas=阿特拉斯是轨道上的固定空间站，为我们提供生产能力。
ship-desc-Odysseus=奥德修斯是一艘为探索星系而建造的飞船。
ship-desc-Hephaestus=赫菲斯托斯通常驻留于火神星，让我们得以利用该行星的资源。
ship-desc-Zeus=宙斯驾驭着惊雷星的闪电，为我们提供其宝藏的一部分。
ship-desc-Gaia=盖亚从句芒星的腐殖质中生长，我们也一样。
ship-desc-Chione=寒冷而遥远的玄冥星之旅程令人瑟瑟发抖。
ship-desc-Galactica=卡拉狄加穿梭于星辰之间。

[expanse-lore]
m4-0=轨道空间站阿特拉斯承担研究和基础太空材料收集的任务。
m4-1=我们需要发送空间站启动包来创建阿特拉斯。
m4-2=空间站已创建，但需要扩建才能开始运作。
m4-3=基础基础设施将使我们能够捕获更多小行星并利用资源。
m4-4=进一步扩建空间站将提高资源获取能力。